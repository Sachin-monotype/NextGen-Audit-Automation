# Local MongoDB for UAT raw/enrich audit logs (keeps Atlas free-tier for Results only).
#
# Start (auto — Docker if Hub works, else Homebrew):
#   ./scripts/start-audit-mongo.sh
# Force Homebrew when Docker Hub is blocked (VPN/corporate network):
#   ./scripts/start-audit-mongo.sh --brew
# Stop Homebrew service: brew services stop mongodb-community@7.0
# URL: mongodb://localhost:27017  →  DB AuditLogsUAT (raw / enriched / dlq)

services:
  audit-mongo:
    image: mongo:7
    container_name: nextgen-audit-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: AuditLogsUAT
    volumes:
      - audit-mongo-data:/data/db
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]

  audit-mongo-qa:
    image: mongo:7
    container_name: nextgen-audit-mongo-qa
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: AuditLogsQA
    volumes:
      - audit-mongo-qa-data:/data/db
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]

  audit-mongo-preprod:
    image: mongo:7
    container_name: nextgen-audit-mongo-preprod
    restart: unless-stopped
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_DATABASE: AuditLogsPreprod
    volumes:
      - audit-mongo-preprod-data:/data/db
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]

  audit-mongo-beta:
    image: mongo:7
    container_name: nextgen-audit-mongo-beta
    restart: unless-stopped
    ports:
      - "27020:27017"
    environment:
      MONGO_INITDB_DATABASE: AuditLogsBeta
    volumes:
      - audit-mongo-beta-data:/data/db
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]

volumes:
  audit-mongo-data:
  audit-mongo-qa-data:
  audit-mongo-preprod-data:
  audit-mongo-beta-data:
